[workspace]
resolver = "3"
members = ["crates/wwt-frame", "crates/wwt-reader", "crates/wwt-png", "crates/wwt-term", "crates/wwt-cdp", "crates/wwt-page", "crates/wwt-ui", "crates/wwt"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
rustix = { version = "1.1", features = ["termios"] }
anyhow = "1.0"
thiserror = "2.0"
tempfile = "3"
