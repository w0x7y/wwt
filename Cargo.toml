[workspace]
resolver = "3"
members = ["crates/wb-frame", "crates/wb-term", "crates/wb-cdp", "crates/wb-page", "crates/webinal"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.29"
rustix = { version = "1.1", features = ["termios"] }
anyhow = "1.0"
thiserror = "2.0"
tempfile = "3"
